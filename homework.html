<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Engineering College</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 4px 10px;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      height: 38px;
      background: #dce8fc;
      border-radius: 7px;
      text-align: center;
      padding: 3px;
    }

    nav a {
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .caption {
      font-size: 12px;
      color: #444;
      margin-top: 5px;
    }

    main {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      min-height: 170px;
    }

    aside {
      width: 26%;
      background: #fce3bd;
      border-radius: 7px;
      padding: 12px 8px;
    }

    section {
      flex: 1;
      background: #d9f1d9;
      border-radius: 7px;
      padding: 12px 8px;
      color: #456447;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #222;
    }

    aside p,
    section p {
      margin: 0 0 8px;
      font-size: 13px;
    }

    footer {
      margin-top: 4px;
      height: 46px;
      background: #e9def7;
      border-radius: 7px;
      text-align: center;
      padding: 6px;
    }

    footer strong {
      display: block;
    }

    footer .caption {
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="#">HOME</a> |
      <a href="#">ABOUT</a> |
      <a href="#">COURSES</a> |
      <a href="#">ADMISSIONS</a> |
      <a href="#">CONTACT</a>
    </nav>
    <div class="caption">Navigation – 10%</div>
  </header>

  <main>
    <aside>
      <h2>Departments</h2>
      <p>CSE</p>
      <p>ECE</p>
      <p>EEE</p>
      <p>Mechanical</p>
      <p>Left – 25%</p>
    </aside>

    <section>
      <h2>College Information</h2>
      <p>Welcome to KL university</p>
      <p>Latest announcements</p>
      <p>Upcoming events and activities</p>
      <p>Right – 75%</p>
    </section>
  </main>

  <footer>
    <strong>© 2026 KL university</strong>
    <div class="caption">Footer – 10%</div>
  </footer>
</body>
</html>
